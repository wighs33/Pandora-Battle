AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LabProject backend - Steam login, GameLift game session placement, match results and boss raids.
  The Lambda functions write DynamoDB; the API server on EC2 (Backend/server) writes RDS MySQL.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: '[a-z0-9-]+'
  SteamAppId:
    Type: String
    Default: '4972140'
  SteamTicketIdentity:
    Type: String
    Default: labproject-backend
    Description: Must match the identity the client passes to GetAuthTicketForWebApi (BackendSettings.SteamWebApiIdentity).
  AllowDevLogin:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enables POST /auth/dev for testing several clients on one PC. Set false for any public stage.
  GameLiftFleetId:
    Type: String
    Default: ''
    Description: Fleet ID or ARN used by POST /match/join. Leave empty until a fleet exists.
  GameLiftLocation:
    Type: String
    Default: ''
    Description: Custom location for an Anywhere fleet (for example custom-labproject-dev). Empty for managed EC2 home Region.
  MaxPlayersPerSession:
    Type: Number
    Default: 4
    MinValue: 1
    MaxValue: 16
  MaxPlayersPerBossRaidSession:
    Type: Number
    Default: 6
    MinValue: 1
    MaxValue: 6
    Description: Players per boss raid session. The game server accepts at most 6 (PdGameSession::MaxPlayerCount).
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the API server and the database (deploy.ps1 passes the default VPC).
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets in at least two Availability Zones. The API server uses the first one.
  ApiImageId:
    Type: AWS::EC2::Image::Id
    Description: Amazon Linux 2023 arm64 AMI. deploy.ps1 resolves it on the first deploy and keeps it afterwards, so a newer AMI does not replace the server.
  ApiInstanceType:
    Type: String
    Default: t4g.micro
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        STAGE: !Ref Stage
        TABLE_NAME: !Ref GameTable
        TOKEN_SECRET_PARAM: !Sub /labproject/${Stage}/token-signing-key

Resources:
  # Single table: player profile, per-player match history, match results and boss raids, separated by PK/SK.
  # On-demand billing keeps the idle cost near zero.
  # Retain: the data moves to MySQL (app.import_dynamodb), and the table is deleted by hand after a backup.
  GameTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub labproject-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: RankKey
          AttributeType: S
        - AttributeName: Damage
          AttributeType: N
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # Boss raid ranking: one partition per raid, sorted by cumulative damage.
      # Only player rows that have dealt damage carry both keys, so the index holds nothing else.
      GlobalSecondaryIndexes:
        - IndexName: RaidRanking
          KeySchema:
            - AttributeName: RankKey
              KeyType: HASH
            - AttributeName: Damage
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [DisplayName]

  # Routes that a Lambda event does not claim fall through to $default, the MySQL API server on EC2.
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        EnableIamAuthorizer: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: !Ref AWS::StackName
          version: '1.0'
        paths:
          $default:
            x-amazon-apigateway-any-method:
              isDefaultRoute: true
              x-amazon-apigateway-integration:
                type: http_proxy
                httpMethod: ANY
                connectionType: VPC_LINK
                connectionId: !Ref ApiVpcLink
                uri: !GetAtt ApiService.Arn
                payloadFormatVersion: '1.0'

  # API server (Backend/server) ---------------------------------------------------------------------------------------
  # API Gateway reaches the server through a VPC link and Cloud Map, so the server port is not open to the internet.
  # The server keeps a public IP only for outbound calls (Steam Web API, GameLift, SSM, S3) without a NAT gateway.
  ApiVpcLinkSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub LabProject ${Stage} API Gateway VPC link
      VpcId: !Ref VpcId

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub LabProject ${Stage} API server
      VpcId: !Ref VpcId

  ApiFromVpcLinkIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ApiSecurityGroup
      SourceSecurityGroupId: !Ref ApiVpcLinkSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub LabProject ${Stage} MySQL
      VpcId: !Ref VpcId

  DatabaseFromApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      SourceSecurityGroupId: !Ref ApiSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306

  # Session Manager replaces SSH. The server reads its settings and secrets from /labproject/<stage>/ at install time.
  ApiInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ApiServer
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/labproject/${Stage}/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::labproject-deploy-${AWS::AccountId}-${AWS::Region}/${Stage}/server/*
              - Effect: Allow
                Action:
                  - gamelift:SearchGameSessions
                  - gamelift:CreateGameSession
                  - gamelift:DescribeGameSessions
                  - gamelift:CreatePlayerSession
                Resource: '*'
              # Only for the one-time copy of the Lambda backend's table (app.import_dynamodb).
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt GameTable.Arn

  ApiInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ApiInstanceRole]

  ApiInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ApiImageId
      InstanceType: !Ref ApiInstanceType
      IamInstanceProfile: !Ref ApiInstanceProfile
      SubnetId: !Select [0, !Ref SubnetIds]
      SecurityGroupIds: [!Ref ApiSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 8
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub labproject-${Stage}-api

  ApiNamespace:
    Type: AWS::ServiceDiscovery::HttpNamespace
    Properties:
      Name: !Sub labproject-${Stage}

  ApiService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: api
      NamespaceId: !GetAtt ApiNamespace.Id
      Type: HTTP

  ApiServiceInstance:
    Type: AWS::ServiceDiscovery::Instance
    Properties:
      ServiceId: !GetAtt ApiService.Id
      InstanceId: !Ref ApiInstance
      InstanceAttributes:
        AWS_INSTANCE_IPV4: !GetAtt ApiInstance.PrivateIp
        AWS_INSTANCE_PORT: '8000'

  # VPC links are not available in every Availability Zone (ap-northeast-2d is rejected). deploy.ps1 sorts the
  # subnets by zone, so the first two (2a, 2b) are supported and include the API server's subnet.
  ApiVpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      Name: !Sub labproject-${Stage}
      SubnetIds:
        - !Select [0, !Ref SubnetIds]
        - !Select [1, !Ref SubnetIds]
      SecurityGroupIds: [!Ref ApiVpcLinkSecurityGroup]

  # Non-secret settings for Backend/server/deploy/install.sh (secrets are SecureString parameters made by deploy.ps1).
  ApiSettingsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /labproject/${Stage}/api-settings
      Type: String
      Value: !Sub |-
        ALLOW_DEV_LOGIN=${AllowDevLogin}
        STEAM_APP_ID=${SteamAppId}
        STEAM_TICKET_IDENTITY=${SteamTicketIdentity}
        GAMELIFT_FLEET_ID=${GameLiftFleetId}
        GAMELIFT_LOCATION=${GameLiftLocation}
        MAX_PLAYERS_PER_SESSION=${MaxPlayersPerSession}
        MAX_PLAYERS_PER_BOSS_RAID_SESSION=${MaxPlayersPerBossRaidSession}

  DatabaseEndpointParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /labproject/${Stage}/db-endpoint
      Type: String
      Value: !GetAtt Database.Endpoint.Address

  # Database ----------------------------------------------------------------------------------------------------------
  # Private, encrypted, daily backups for 7 days. Deleting the stack keeps a final snapshot, and deletion protection
  # has to be turned off by hand first.
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub LabProject ${Stage} MySQL subnets
      SubnetIds: !Ref SubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub labproject-${Stage}
      Engine: mysql
      EngineVersion: '8.4'
      AutoMinorVersionUpgrade: true
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: admin
      MasterUserPassword: !Sub '{{resolve:ssm-secure:/labproject/${Stage}/db-master-password}}'
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      DeletionProtection: true

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      # CodeUri stays on each function: 'aws cloudformation package' does not read SAM Globals.
      CodeUri: src/
      Handler: auth.handler
      Environment:
        Variables:
          STEAM_APP_ID: !Ref SteamAppId
          STEAM_TICKET_IDENTITY: !Ref SteamTicketIdentity
          STEAM_KEY_PARAM: !Sub /labproject/${Stage}/steam-web-api-key
          ALLOW_DEV_LOGIN: !Ref AllowDevLogin
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt GameTable.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/labproject/${Stage}/token-signing-key
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/labproject/${Stage}/steam-web-api-key
      Events:
        SteamLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /auth/steam
        DevLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /auth/dev

  MatchJoinFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: match_join.handler
      Timeout: 29
      Environment:
        Variables:
          GAMELIFT_FLEET_ID: !Ref GameLiftFleetId
          GAMELIFT_LOCATION: !Ref GameLiftLocation
          MAX_PLAYERS_PER_SESSION: !Ref MaxPlayersPerSession
          MAX_PLAYERS_PER_BOSS_RAID_SESSION: !Ref MaxPlayersPerBossRaidSession
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - gamelift:SearchGameSessions
                - gamelift:CreateGameSession
                - gamelift:DescribeGameSessions
                - gamelift:CreatePlayerSession
              Resource: '*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt GameTable.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/labproject/${Stage}/token-signing-key
      Events:
        Join:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /match/join

  PlayerProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: player.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt GameTable.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/labproject/${Stage}/token-signing-key
      Events:
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /player/me

  # Status needs no login: the title screen asks before the player logs in. Ranking and rewards need the session token.
  # Backend/bossraid.ps1 opens and closes raids.
  BossRaidFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: boss_raid.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt GameTable.Arn
                - !Sub ${GameTable.Arn}/index/*
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/labproject/${Stage}/token-signing-key
      Events:
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /bossraid/status
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /bossraid/me
        Claim:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /bossraid/claim

  # Game servers only. API Gateway verifies the SigV4 signature, so a client session token cannot call it.
  MatchResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: match_result.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt GameTable.Arn
      Events:
        Report:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /server/match-result
            Auth:
              Authorizer: AWS_IAM

  # Game servers only, like match-result. Boss raid damage lowers the shared world boss health.
  RaidDamageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: raid_damage.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt GameTable.Arn
      Events:
        Report:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /server/raid-damage
            Auth:
              Authorizer: AWS_IAM

  # Instance role for a managed EC2 fleet. The game server gets temporary credentials for it
  # through GetFleetRoleCredentials and signs the match-result and raid-damage requests with them.
  GameServerFleetRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: gamelift.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReportMatchResults
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: execute-api:Invoke
                Resource:
                  - !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/POST/server/match-result
                  - !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/POST/server/raid-damage

Outputs:
  ApiUrl:
    Description: Put this in Config/DefaultGame.ini [/Script/LabProject.BackendSettings] as ApiBaseUrl="<url>" (quotes required, unquoted // is a comment).
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  TableName:
    Value: !Ref GameTable
  ApiInstanceId:
    Description: deploy.ps1 and bossraid.ps1 run commands on this instance through SSM Run Command.
    Value: !Ref ApiInstance
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  GameServerFleetRoleArn:
    Description: Use as the managed EC2 fleet InstanceRoleArn and pass it to the server with -FleetRoleArn=.
    Value: !GetAtt GameServerFleetRole.Arn
