# 푸시마다 API 서버(Backend/server) 테스트를 GitHub 호스팅 러너에서 돌린다.
#
# 단위 테스트는 DB 없이 돌고, API 테스트는 서비스 컨테이너로 띄운 MySQL 8.4에 붙는다. 테스트 계정은 RDS와 같은
# app.provision으로 만든다. Unreal 빌드·자동화 테스트와 패키징은 전체 에셋이 있는 개발 PC에서 Scripts/의 스크립트로 직접 돌린다.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          # 이 작업의 컨테이너 안에서만 쓰는 시험용 비밀번호
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      LABPROJECT_TEST_DATABASE_URL: mysql+pymysql://labproject_app:ci-app@127.0.0.1:3306/labproject_test
      LABPROJECT_TEST_OWNER_DATABASE_URL: mysql+pymysql://labproject_owner:ci-owner@127.0.0.1:3306/labproject_test
    defaults:
      run:
        working-directory: Backend/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/server/requirements.txt

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Create test database accounts
        env:
          LABPROJECT_MASTER_DATABASE_URL: mysql+pymysql://root:ci-root@127.0.0.1:3306/
          LABPROJECT_OWNER_DATABASE_URL: ${{ env.LABPROJECT_TEST_OWNER_DATABASE_URL }}
          LABPROJECT_DATABASE_URL: ${{ env.LABPROJECT_TEST_DATABASE_URL }}
        run: python -m app.provision

      - name: Unit and API tests
        run: python -m unittest discover -s tests -t . -v
