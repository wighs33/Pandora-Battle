# 푸시마다 백엔드 단위 테스트를 GitHub 호스팅 러너에서 돌린다.
#
# 백엔드 테스트는 표준 라이브러리만 쓰므로 별도 설치가 없다. Unreal 빌드·자동화 테스트와 패키징은
# 전체 에셋이 있는 개발 PC에서 Scripts/의 스크립트로 직접 돌린다.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Backend unit tests
        run: python -m unittest discover -s Backend/tests -v
